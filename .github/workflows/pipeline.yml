name: Melos + FVM CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: build (Flutter ${{ matrix.flutter }})
    strategy:
      # Обе версии должны отчитаться: падение на 3.38 — это регрессия
      # совместимости, а не повод прятать результат прогона на 3.47.
      fail-fast: false
      matrix:
        # 3.47.4 — версия разработки (.fvmrc). 3.38.5 держим в матрице,
        # потому что пакеты заявляют совместимость со старыми SDK, и без
        # прогона это утверждение ничем не проверено. Промежуточные релизы
        # не гоняем: матрица проверяет границы поддерживаемого диапазона.
        flutter: [ "3.38.5", "3.47.4" ]
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        # также актуализация Flutter, если нужен fvm

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install Flutter ${{ matrix.flutter }} via FVM
        run: fvm use ${{ matrix.flutter }} --force

      # ВАЖНО: активируем melos через flutter, чтобы не было несовместимости
      - name: Install Melos
        run: fvm flutter pub global activate melos

      - name: Bootstrap workspace
        run: fvm flutter pub global run melos bootstrap

      - name: CodeGen
        run: fvm flutter pub global run melos run codegen

      - name: Analyze all packages
        run: fvm flutter pub global run melos run analyze

      - name: Run all tests
        run: fvm flutter pub global run melos run test
