name: cherrypick_lint
description: >
  Analyzer plugin that catches CherryPick DI API misuse right in the IDE and
  in dart analyze: missing await on scope disposal, misused annotations, and
  runtime traps.
version: 0.1.0
homepage: https://cherrypick-di.netlify.app
documentation: https://cherrypick-di.netlify.app/docs/intro
repository: https://github.com/pese-git/cherrypick/cherrypick_lint
issue_tracker: https://github.com/pese-git/cherrypick/issues
topics:
  - lint
  - di
  - ioc
  - dependency-injection
  - static-analysis

environment:
  # analyzer 14.3.0 requires Dart >=3.11; the repo is pinned to Flutter 3.41.7
  # (Dart 3.11.5) partly for that reason — see the change docs in
  # openspec/changes/cherrypick-lint-migrate-plugin-framework.
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  # Exact versions, mirroring how analysis_server_plugin itself pins analyzer:
  # every published release pins one exact analyzer version, so a range here
  # would only resolve to whatever that pin allows anyway.
  analysis_server_plugin: 0.3.22
  analyzer: 14.3.0
  analyzer_plugin: 0.14.16

dev_dependencies:
  analyzer_testing: ^0.4.1
  lints: ^6.0.0
  test: ^1.25.8
  test_reflective_loader: ^0.4.0
