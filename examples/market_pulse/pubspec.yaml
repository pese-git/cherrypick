name: market_pulse
description: "CherryPick DI showcase: a web-only live market dashboard with a built-in DI Inspector."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Web-only app: needed for the path URL strategy, so /market/BTCUSD is a real
  # URL instead of living behind a #fragment.
  flutter_web_plugins:
    sdk: flutter

  cherrypick: ^4.0.0-dev.3
  cherrypick_annotations: ^4.0.0-dev.0
  cherrypick_flutter: ^4.0.0-dev.3

  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  fpdart: ^1.1.0
  go_router: ^17.5.0

  talker_flutter: ^5.0.0
  talker_cherrypick_logger: ^4.0.0-dev.3
  talker_bloc_logger: ^5.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.5.0
  freezed: ^3.2.3
  cherrypick_generator: ^4.0.0-dev.3

flutter:
  uses-material-design: true
