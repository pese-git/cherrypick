name: cherrypick_workspace

sdkPath: .fvm/flutter_sdk

packages:
  - benchmark_di
  - cherrypick
  - cherrypick_flutter
  - cherrypick_annotations
  - cherrypick_generator
  - cherrypick_lint
  - cherrypick_lint/example
  - talker_cherrypick_logger
  - examples/client_app
  - examples/postly
  - examples/market_pulse

scripts:
  clean_all:
    run: |
      melos clean
      melos exec -- rm -rf lib/**.g.dart lib/**/**.g.dart lib/generated/
      melos exec -- rm -rf .dart_tool build pubspec_overrides.yaml
    description: |
      Очищает build артефакты flutter и сгенерированный код во всех пакетах.

  all:
    steps:
      - codegen
      - analyze
      - lint:custom_lint
      - format
      - test
    description: Run all steps.

  lint:all:
    steps:
      - analyze
      - lint:custom_lint
      - format
    description: Run all static analysis checks.

  analyze:
    exec: dart analyze
    packageFilters:
      # dart analyze intermittently crashes the analysis server on these two
      # packages under the FVM-pinned Dart 3.10.0 (Flutter 3.38.1) — a bug in
      # the SDK's built-in analyzer_plugin bridge loading custom_lint_builder
      # 0.8.1, not a defect in cherrypick_lint itself. See lint:custom_lint
      # below for the actual correctness check on this package, and
      # cherrypick_lint/README.md for details.
      ignore: ["cherrypick_lint", "cherrypick_lint_example"]

  lint:custom_lint:
    description: >
      Verify cherrypick_lint's rules via its real testing mechanism
      (dart analyze does not surface custom_lint diagnostics, and crashes
      intermittently on this package under the pinned Dart 3.10.0 — see the
      `analyze` script above).
    exec: dart run custom_lint
    packageFilters:
      scope: ["cherrypick_lint_example"]

  format:
    exec: dart format lib

  test:
    steps:
      - test:dart
      - test:flutter
    description: Run all tests.

  test:dart:
    description: "Run tests for Dart packages only"
    exec: dart test --reporter=compact
    packageFilters:
      scope:
        [
          "cherrypick",
          "cherrypick_annotations",
          "cherrypick_generator",
          "cherrypick_lint",
        ]

  test:flutter:
    description: "Run tests for Flutter packages only"
    exec: flutter test --reporter=compact
    packageFilters:
      scope: ["cherrypick_flutter", "market_pulse"]

  codegen:
    description: "Run build for Flutter packages only" 
    exec: dart run build_runner build --delete-conflicting-outputs
    packageFilters:
      scope: ["postly", "market_pulse"]

  outdated:
    exec: dart pub outdated 

  upgrade:
    exec: dart pub upgrade --major-versions

  drop:
    exec: flutter clean
